# -----------------------------------------------------------------------------
# Default values for the conure chart.
# -----------------------------------------------------------------------------

nameOverride: ""
fullnameOverride: ""

# Common labels added to every rendered object.
commonLabels: {}

# -----------------------------------------------------------------------------
# CRDs
# -----------------------------------------------------------------------------
# CRDs are rendered as templates so they can be enabled/disabled per install.
# Disable when CRDs are managed out-of-band (e.g. already applied to the cluster).
crds:
  install: true

# -----------------------------------------------------------------------------
# Controller manager (cmd/control)
# -----------------------------------------------------------------------------
controller:
  enabled: true
  replicaCount: 1
  image:
    repository: coffeenights/conure-controller
    tag: ""           # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""          # defaults to "<release>-controller"
    annotations: {}
  args:
    - --leader-elect
    - --health-probe-bind-address=:8081
    - --metrics-bind-address=0
  leaderElect: true
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 64Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  securityContext:
    runAsNonRoot: true
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop:
        - ALL
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8081
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8081
    initialDelaySeconds: 5
    periodSeconds: 10
  metrics:
    enabled: false
    port: 8443

# -----------------------------------------------------------------------------
# API server (cmd/api-server)
# -----------------------------------------------------------------------------
apiServer:
  enabled: true
  replicaCount: 1
  image:
    repository: coffeenights/conure-api
    tag: ""           # defaults to .Chart.AppVersion when empty
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  serviceAccount:
    create: true
    name: ""          # defaults to "<release>-api"
    annotations: {}
  command: ["/app/conure_api"]
  args: ["runserver", "--address=0.0.0.0", "--port=8080"]
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
    annotations: {}
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 50m
      memory: 64Mi
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}
  livenessProbe:
    httpGet:
      path: /healthz
      port: 8080
    initialDelaySeconds: 20
    periodSeconds: 20
    failureThreshold: 6
  readinessProbe:
    httpGet:
      path: /readyz
      port: 8080
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 6

  # Configuration consumed as environment variables by the API server.
  config:
    mongodbName: conure
    # Set mongodbUri explicitly to override the auto-derived value when
    # mongodb.enabled=true. Required when mongodb.enabled=false.
    mongodbUri: ""
    jwtExpirationDays: 3
    providerSource: vela
    aesStorageStrategy: k8s
    authStrategySystem: local
    authServiceUrl: "http://localhost:8080/auth/me"
    frontendDomain: localhost
    cookieSecure: false
    corsOrigins: "http://localhost:5173"
    ginMode: release

  # Secret values. Provide via existingSecret OR populate inline (chart will
  # render a Secret). Inline values are stored as plain Secret data, not SealedSecrets.
  secrets:
    existingSecret: ""        # if set, the chart skips rendering its own Secret
    # Random JWT secret. Override in production.
    jwtSecret: "change-me-in-production"
    # MongoDB URI override (sensitive). Auto-derived when empty and mongodb.enabled=true.
    mongodbUri: ""

  # AES storage key — when aesStorageStrategy=k8s the API server expects a
  # Secret named `secret-key` in the same namespace with a `key` entry. When
  # this is enabled the chart renders that Secret. Disable if it already
  # exists in the namespace (e.g. created with `createsecretkey`).
  aesSecret:
    create: false
    name: secret-key

  # Bootstrap superuser. When enabled, a post-install Helm hook Job runs
  # `conure_api createsuperuser` once per release to create the admin in
  # MongoDB. The plaintext password is stored in a Secret (annotated with
  # helm.sh/resource-policy: keep) so it survives upgrades and uninstalls
  # and can be retrieved via `kubectl get secret`. Hashed copy lives in the
  # MongoDB users collection. The Job is idempotent — if the email already
  # exists in MongoDB the create is skipped.
  adminUser:
    enabled: true
    email: admin@conure.io
    # Name of the Secret holding `email` and `password` keys. If a Secret
    # with this name already exists in the release namespace it is reused,
    # so the password is generated only on first install.
    secretName: ""           # defaults to "<release>-api-admin"
    # Optional override. Leave empty to auto-generate on first install.
    password: ""

# -----------------------------------------------------------------------------
# MongoDB — bundled inline (single replica, dev/test grade).
# Disabled by default: most installs should target an external MongoDB.
# Not intended for production — point at a managed MongoDB or the official
# MongoDB operator when running for real workloads.
# -----------------------------------------------------------------------------
mongodb:
  enabled: false
  image:
    repository: mongo
    tag: "7.0"
    pullPolicy: IfNotPresent
  auth:
    rootUser: root
    rootPassword: "change-me-mongo-root"
    username: conure
    password: "change-me-mongo"
    database: conure
  service:
    # ClusterIP (default), LoadBalancer, or NodePort. Use LoadBalancer for
    # external access — that's the simplest path; standard Ingress is HTTP only.
    type: ClusterIP
    port: 27017
    annotations: {}
  # Optional Ingress for MongoDB. Standard Ingress is HTTP-only — this is only
  # useful with a TCP/L4-capable controller (NGINX tcp-services, Traefik
  # IngressRouteTCP, etc.) configured via annotations. Prefer service.type:
  # LoadBalancer for external access in most cases.
  ingress:
    enabled: false
    className: ""
    annotations: {}
    hosts: []
    tls: []
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""        # empty = cluster default
    accessMode: ReadWriteOnce
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  podAnnotations: {}
  nodeSelector: {}
  tolerations: []
  # Pod affinity / anti-affinity / node affinity rules. Empty = no constraint.
  # Common shapes:
  #
  # 1. Hard-pin to nodes with a label (pod won't schedule if no match):
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions:
  #             - key: role
  #               operator: In
  #               values: [database]
  #
  # 2. Soft-prefer nodes with a label (falls back to any node):
  # affinity:
  #   nodeAffinity:
  #     preferredDuringSchedulingIgnoredDuringExecution:
  #       - weight: 100
  #         preference:
  #           matchExpressions:
  #             - key: role
  #               operator: In
  #               values: [database]
  #
  # 3. Pin to a specific cloud node pool / availability zone (same shape as #1
  #    with a different label key):
  # affinity:
  #   nodeAffinity:
  #     requiredDuringSchedulingIgnoredDuringExecution:
  #       nodeSelectorTerms:
  #         - matchExpressions:
  #             - key: cloud.google.com/gke-nodepool
  #               operator: In
  #               values: [db-pool]
  affinity: {}
