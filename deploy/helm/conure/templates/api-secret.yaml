{{- if and .Values.apiServer.enabled (not .Values.apiServer.secrets.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conure.api.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
type: Opaque
stringData:
  JWT_SECRET: {{ required "apiServer.secrets.jwtSecret is required" .Values.apiServer.secrets.jwtSecret | quote }}
  API_MONGODB_URI: {{ include "conure.api.mongodbUri" . | quote }}
{{- end }}
{{- if and .Values.apiServer.enabled .Values.apiServer.aesSecret.create }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.apiServer.aesSecret.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  # AES key consumed by the API server. Replace with output of `createsecretkey`.
  key: {{ randAlphaNum 32 | quote }}
{{- end }}
