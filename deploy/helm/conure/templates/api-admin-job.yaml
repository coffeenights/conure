{{- if and .Values.apiServer.enabled .Values.apiServer.adminUser.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "conure.api.fullname" . }}-create-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
  annotations:
    # Run only on `helm install`. CreateSuperuser is idempotent so the
    # Job exits 0 if the admin already exists.
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "5"
    # Delete on success so the password env var doesn't linger in the
    # Job spec. before-hook-creation guards against a stale Job blocking
    # a fresh install of the same release name.
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        {{- include "conure.api.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "conure.api.serviceAccountName" . }}
      {{- with .Values.apiServer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: create-admin
          image: "{{ .Values.apiServer.image.repository }}:{{ .Values.apiServer.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.apiServer.image.pullPolicy }}
          command: ["/app/conure_api"]
          args:
            - "createsuperuser"
            - "-email=$(ADMIN_EMAIL)"
            - "-password=$(ADMIN_PASSWORD)"
          envFrom:
            - configMapRef:
                name: {{ include "conure.api.configMapName" . }}
            - secretRef:
                name: {{ include "conure.api.secretName" . }}
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: ADMIN_EMAIL
              value: {{ .Values.apiServer.adminUser.email | quote }}
            - name: ADMIN_PASSWORD
              value: {{ include "conure.api.adminPassword" . | quote }}
          {{- with .Values.apiServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.apiServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}