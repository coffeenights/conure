{{- if .Values.mongodb.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.auth.rootUser | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.auth.rootPassword | quote }}
  MONGO_INITDB_DATABASE: {{ .Values.mongodb.auth.database | quote }}
  CONURE_DB_USER: {{ .Values.mongodb.auth.username | quote }}
  CONURE_DB_PASSWORD: {{ .Values.mongodb.auth.password | quote }}
  CONURE_DB_NAME: {{ .Values.mongodb.auth.database | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conure.mongodb.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
data:
  init-conure-user.sh: |
    #!/bin/bash
    set -e
    mongosh \
      --host 127.0.0.1 \
      -u "${MONGO_INITDB_ROOT_USERNAME}" \
      -p "${MONGO_INITDB_ROOT_PASSWORD}" \
      --authenticationDatabase admin \
      "${CONURE_DB_NAME}" <<EOF
    db.createUser({
      user: "${CONURE_DB_USER}",
      pwd:  "${CONURE_DB_PASSWORD}",
      roles: [ { role: "readWrite", db: "${CONURE_DB_NAME}" } ]
    });
    EOF
---
# Headless service required by the StatefulSet for stable per-pod DNS
# (<pod>.<service>.<ns>.svc.cluster.local). Clients should not target this
# directly — use the typed service below.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "conure.mongodb.fullname" . }}-headless
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "conure.mongodb.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.service.port }}
      targetPort: mongodb
      protocol: TCP
---
# Client-facing service. The api-server connects to this name. Type is
# configurable (ClusterIP / LoadBalancer / NodePort).
apiVersion: v1
kind: Service
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
  {{- with .Values.mongodb.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.mongodb.service.type }}
  selector:
    {{- include "conure.mongodb.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.service.port }}
      targetPort: mongodb
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
spec:
  replicas: 1
  serviceName: {{ include "conure.mongodb.fullname" . }}-headless
  # IMMUTABLE: .spec.selector cannot change after creation. Keep it on
  # selectorLabels (version-stable) — never conure.mongodb.labels.
  selector:
    matchLabels:
      {{- include "conure.mongodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conure.mongodb.selectorLabels" . | nindent 8 }}
      {{- with .Values.mongodb.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "conure.mongodb.fullname" . }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.mongodb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: init
          configMap:
            name: {{ include "conure.mongodb.fullname" . }}-init
            defaultMode: 0755
        {{- if not .Values.mongodb.persistence.enabled }}
        - name: data
          emptyDir: {}
        {{- end }}
      {{- with .Values.mongodb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongodb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongodb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.mongodb.persistence.enabled }}
  # IMMUTABLE: volumeClaimTemplates cannot be patched after creation. Its
  # labels MUST be version-stable, so this uses selectorLabels, not
  # conure.mongodb.labels (which carries helm.sh/chart + version and would
  # change every release, making `helm upgrade` fail). Do not "enrich" these.
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "conure.mongodb.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          - {{ .Values.mongodb.persistence.accessMode }}
        resources:
          requests:
            storage: {{ .Values.mongodb.persistence.size | quote }}
        {{- with .Values.mongodb.persistence.storageClass }}
        storageClassName: {{ . | quote }}
        {{- end }}
  {{- end }}
{{- if .Values.mongodb.ingress.enabled }}
---
# MongoDB ingress. Standard Kubernetes Ingress is HTTP-only; exposing MongoDB
# externally usually requires either:
#   - a TCP-capable ingress controller (e.g. NGINX with a tcp-services
#     ConfigMap, Traefik IngressRouteTCP) configured via annotations, or
#   - setting mongodb.service.type=LoadBalancer (simpler, recommended).
# This Ingress is rendered as-is for users whose controller supports L4/TCP
# routing through the Ingress resource via annotations.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
  {{- with .Values.mongodb.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.mongodb.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.mongodb.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.mongodb.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType | default "Prefix" }}
            backend:
              service:
                name: {{ include "conure.mongodb.fullname" $ }}
                port:
                  number: {{ $.Values.mongodb.service.port }}
          {{- end }}
    {{- end }}
{{- end }}
{{- end }}