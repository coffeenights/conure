{{- if .Values.mongodb.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
type: Opaque
stringData:
  MONGO_INITDB_ROOT_USERNAME: {{ .Values.mongodb.auth.rootUser | quote }}
  MONGO_INITDB_ROOT_PASSWORD: {{ .Values.mongodb.auth.rootPassword | quote }}
  MONGO_INITDB_DATABASE: {{ .Values.mongodb.auth.database | quote }}
  CONURE_DB_USER: {{ .Values.mongodb.auth.username | quote }}
  CONURE_DB_PASSWORD: {{ .Values.mongodb.auth.password | quote }}
  CONURE_DB_NAME: {{ .Values.mongodb.auth.database | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "conure.mongodb.fullname" . }}-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
data:
  init-conure-user.sh: |
    #!/bin/bash
    set -e
    mongosh \
      --host 127.0.0.1 \
      -u "${MONGO_INITDB_ROOT_USERNAME}" \
      -p "${MONGO_INITDB_ROOT_PASSWORD}" \
      --authenticationDatabase admin \
      "${CONURE_DB_NAME}" <<EOF
    db.createUser({
      user: "${CONURE_DB_USER}",
      pwd:  "${CONURE_DB_PASSWORD}",
      roles: [ { role: "readWrite", db: "${CONURE_DB_NAME}" } ]
    });
    EOF
{{- if .Values.mongodb.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - {{ .Values.mongodb.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.mongodb.persistence.size | quote }}
  {{- with .Values.mongodb.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "conure.mongodb.selectorLabels" . | nindent 4 }}
  ports:
    - name: mongodb
      port: {{ .Values.mongodb.service.port }}
      targetPort: mongodb
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conure.mongodb.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.mongodb.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "conure.mongodb.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conure.mongodb.selectorLabels" . | nindent 8 }}
      {{- with .Values.mongodb.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      containers:
        - name: mongodb
          image: "{{ .Values.mongodb.image.repository }}:{{ .Values.mongodb.image.tag }}"
          imagePullPolicy: {{ .Values.mongodb.image.pullPolicy }}
          ports:
            - name: mongodb
              containerPort: 27017
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "conure.mongodb.fullname" . }}
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          livenessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command:
                - mongosh
                - --quiet
                - --eval
                - "db.adminCommand('ping').ok"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          {{- with .Values.mongodb.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: init
          configMap:
            name: {{ include "conure.mongodb.fullname" . }}-init
            defaultMode: 0755
        - name: data
        {{- if .Values.mongodb.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "conure.mongodb.fullname" . }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.mongodb.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongodb.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.mongodb.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
