{{- if .Values.controller.enabled -}}
{{- if .Values.controller.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conure.controller.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.controller.labels" . | nindent 4 }}
  {{- with .Values.controller.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
---
{{- end }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "conure.controller.fullname" . }}-manager
  labels:
    {{- include "conure.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [core.conure.io]
    resources: [applications, components, workflows, workflowruns, componentdefinitions, actiondefinitions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [core.conure.io]
    resources:
      - applications/status
      - components/status
      - workflows/status
      - workflowruns/status
    verbs: [get, update, patch]
  - apiGroups: [core.conure.io]
    resources:
      - applications/finalizers
      - components/finalizers
      - workflows/finalizers
      - workflowruns/finalizers
    verbs: [update]
  # Workloads the controller renders for application components.
  - apiGroups: [""]
    resources: [services, configmaps, secrets, serviceaccounts, namespaces, events, persistentvolumeclaims]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [apps]
    resources: [deployments, statefulsets, daemonsets, replicasets]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses, networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "conure.controller.fullname" . }}-manager
  labels:
    {{- include "conure.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "conure.controller.fullname" . }}-manager
subjects:
  - kind: ServiceAccount
    name: {{ include "conure.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "conure.controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.controller.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "conure.controller.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "conure.controller.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "conure.controller.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
