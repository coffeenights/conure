{{- if .Values.apiServer.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "conure.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.apiServer.replicaCount }}
  selector:
    matchLabels:
      {{- include "conure.api.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "conure.api.selectorLabels" . | nindent 8 }}
        {{- with .Values.apiServer.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ printf "%v" .Values.apiServer.config | sha256sum }}
        checksum/secret: {{ printf "%s|%s" (.Values.apiServer.secrets.jwtSecret | default "") (include "conure.api.mongodbUri" .) | sha256sum }}
        {{- with .Values.apiServer.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "conure.api.serviceAccountName" . }}
      {{- with .Values.apiServer.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: api-server
          image: "{{ .Values.apiServer.image.repository }}:{{ .Values.apiServer.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.apiServer.image.pullPolicy }}
          {{- with .Values.apiServer.command }}
          command:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.apiServer.args }}
          args:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "conure.api.secretName" . }}
          env:
            - name: API_MONGODB_NAME
              value: {{ .Values.apiServer.config.mongodbName | quote }}
            - name: JWT_EXPIRATION_DAYS
              value: {{ .Values.apiServer.config.jwtExpirationDays | quote }}
            - name: PROVIDER_SOURCE
              value: {{ .Values.apiServer.config.providerSource | quote }}
            - name: AES_STORAGE_STRATEGY
              value: {{ .Values.apiServer.config.aesStorageStrategy | quote }}
            - name: AUTH_STRATEGY_SYSTEM
              value: {{ .Values.apiServer.config.authStrategySystem | quote }}
            - name: AUTH_SERVICE_URL
              value: {{ .Values.apiServer.config.authServiceUrl | quote }}
            - name: FRONTEND_DOMAIN
              value: {{ .Values.apiServer.config.frontendDomain | quote }}
            - name: COOKIE_SECURE
              value: {{ .Values.apiServer.config.cookieSecure | quote }}
            - name: CORS_ORIGINS
              value: {{ .Values.apiServer.config.corsOrigins | quote }}
            - name: GIN_MODE
              value: {{ .Values.apiServer.config.ginMode | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          {{- with .Values.apiServer.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.apiServer.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.apiServer.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- with .Values.apiServer.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.apiServer.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
