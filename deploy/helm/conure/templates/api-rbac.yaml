{{- if and .Values.apiServer.enabled .Values.apiServer.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conure.api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
  {{- with .Values.apiServer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.apiServer.enabled }}
---
# The API server reads/writes Application CRs and manages the AES storage
# secret in its own namespace when aesStorageStrategy=k8s.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "conure.api.fullname" . }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
rules:
  - apiGroups: [core.conure.io]
    resources: [applications, components, workflows, workflowruns, componentdefinitions, actiondefinitions]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [core.conure.io]
    resources: [applications/status, components/status]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "conure.api.fullname" . }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "conure.api.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conure.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "conure.api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "conure.api.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "conure.api.fullname" . }}-secrets
subjects:
  - kind: ServiceAccount
    name: {{ include "conure.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
