{{- if and .Values.apiServer.enabled .Values.apiServer.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conure.api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
  {{- with .Values.apiServer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.apiServer.enabled }}
---
# Cluster-wide permissions: the API server reads/writes Conure CRs, provisions
# tenant namespaces, and reads workload status (deployments, pods, services,
# events, logs) across application namespaces to serve status/logs endpoints.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "conure.api.fullname" . }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
rules:
  - apiGroups: [core.conure.io]
    resources: [applications, components]
    verbs: [get, list, create, update, delete]
  - apiGroups: [core.conure.io]
    resources: [applications/status, components/status]
    verbs: [get, update]
  # componentdefinitions are cluster-scoped and read-only here: the API
  # server lists them to populate the CLI type picker and resolve a
  # component's rendering engine on create.
  - apiGroups: [core.conure.io]
    resources: [componentdefinitions]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create]
  - apiGroups: [""]
    # `pods get/list/watch` powers both the existing component log/pod
    # endpoints and remote-build log streaming (which lists pods by the
    # Job's `job-name` label before opening a stream).
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services, events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list]
  # /system/info reads node labels to detect the cluster's dominant
  # platform. Read-only, cluster-scoped.
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list]
  # Remote builds: the API creates BuildKit Jobs in conure-system and
  # watches them through completion.
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch, create, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "conure.api.fullname" . }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "conure.api.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conure.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
