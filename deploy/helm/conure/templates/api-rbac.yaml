{{- if and .Values.apiServer.enabled .Values.apiServer.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "conure.api.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
  {{- with .Values.apiServer.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.apiServer.enabled }}
---
# Cluster-wide permissions: the API server reads/writes Conure CRs, provisions
# tenant namespaces, and reads workload status (deployments, pods, services,
# events, logs) across application namespaces to serve status/logs endpoints.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "conure.api.fullname" . }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
rules:
  - apiGroups: [core.conure.io]
    resources: [applications, components]
    verbs: [get, list, create, update, delete]
  - apiGroups: [core.conure.io]
    resources: [applications/status, components/status]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [create]
  - apiGroups: [""]
    resources: [pods, services, events]
    verbs: [list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [apps]
    resources: [deployments, statefulsets]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "conure.api.fullname" . }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "conure.api.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conure.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Release-namespace permissions: AES storage secret (when aesStorageStrategy=k8s)
# and ConfigMaps rendered by the API server in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "conure.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, create, update, delete]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "conure.api.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "conure.api.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "conure.api.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "conure.api.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
