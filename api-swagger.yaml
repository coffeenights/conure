openapi: 3.0.3
info:
  title: Conure API
  description: |
    Conure is a Kubernetes-native application platform.

    **Source-of-truth model:** Kubernetes holds what is actually running.
    MongoDB holds the immutable revision history. Component values are
    versioned per `(component, environment)` pair via `ComponentRevision`s.

    **Core flow:**
    1. `POST /a/{appID}/c` registers a component identity and writes the
       first draft revision in a target environment.
    2. `POST /e/{env}/c/{id}/revisions` adds further drafts.
    3. `POST /e/{env}/c/{id}/deploy` applies the latest draft to K8s and
       flips it to `deployed`. Deployed revisions are immutable.
    4. `POST /e/{env}/c/{id}/revisions/{revID}/deploy` is the rollback
       primitive: it copies a historical revision's values into a new
       deployed revision at the head and applies them.
    5. `POST /a/{appID}/c/{id}/promote` copies the latest deployed revision
       from one env to another as a fresh draft.

    Drift = live `Component.Spec.Values` in K8s vs. the latest deployed
    revision in Mongo. The env-scoped detail endpoint reports both values
    and a structured diff.
  version: 2.0.0
  contact:
    name: Conure API Support
    url: https://github.com/coffeenights/conure

servers:
  - url: http://localhost:8080
    description: Development server

security:
  - bearerAuth: []
  - cookieAuth: []

paths:
  # Authentication ---------------------------------------------------------
  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      description: Authenticate user with email and password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              schema:
                type: string
                example: auth=jwt_token; Path=/; HttpOnly; SameSite=Lax
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    description: JWT authentication token
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user profile
      responses:
        '200':
          description: User profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    patch:
      tags: [Authentication]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "Password changed successfully"
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # Organizations ----------------------------------------------------------
  /organizations:
    get:
      tags: [Organizations]
      summary: List organizations
      responses:
        '200':
          description: List of organizations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganizationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Organizations]
      summary: Create organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrganizationRequest'
      responses:
        '201':
          description: Organization created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /organizations/{organizationID}:
    get:
      tags: [Organizations]
      summary: Get organization details
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: Organization details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Organization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Applications -----------------------------------------------------------
  /organizations/{organizationID}/a:
    get:
      tags: [Applications]
      summary: List applications
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: List of applications
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApplicationListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Applications]
      summary: Create application
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApplicationRequest'
      responses:
        '201':
          description: Application created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationID}/a/{applicationID}:
    get:
      tags: [Applications]
      summary: Get application details
      description: |
        Returns app identity plus the embedded `environments` array.
        Use the env-scoped endpoints below to read live state per env.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
      responses:
        '200':
          description: Application details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Application'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Environments -----------------------------------------------------------
  /organizations/{organizationID}/a/{applicationID}/e:
    post:
      tags: [Environments]
      summary: Create environment
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnvironmentRequest'
      responses:
        '201':
          description: Environment created
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}:
    delete:
      tags: [Environments]
      summary: Delete environment
      description: |
        Removes the environment from the application. Live K8s resources in
        the environment namespace are not automatically reaped — uninstall
        each component first if you want a clean teardown.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
      responses:
        '200':
          description: Environment deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}/deploy:
    post:
      tags: [Environments]
      summary: Bulk-deploy every draft in this environment
      description: |
        For every component that has a `draft` revision in this env, deploy
        its latest draft. Failures are reported per-component; partial
        success is allowed.

        Replaces the legacy `PUT /e/{env}` (DeployApplication).
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
      responses:
        '200':
          description: Bulk deploy result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeployBatchResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # App-wide component identity --------------------------------------------
  /organizations/{organizationID}/a/{applicationID}/c:
    get:
      tags: [Components]
      summary: List components for the application
      description: |
        Returns each component's identity plus a per-environment presence
        rollup: whether it is active (CRD exists), whether a draft is
        outstanding, latest deployed/draft versions, and drift flag.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
      responses:
        '200':
          description: List of components
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Components]
      summary: Create component (identity + first draft revision)
      description: |
        Registers the component identity (name, type, description) and
        writes a v1 `draft` revision in the target environment using the
        provided `values`. Use `POST /e/{env}/c/{id}/deploy` afterwards to
        push the draft to K8s.

        If creating the identity succeeds but the first revision insert
        fails, the identity is rolled back so the slate stays clean for a
        retry.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateComponentRequest'
      responses:
        '201':
          description: Component identity + first draft revision
          content:
            application/json:
              schema:
                type: object
                properties:
                  component:
                    $ref: '#/components/schemas/Component'
                  revision:
                    $ref: '#/components/schemas/ComponentRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /organizations/{organizationID}/a/{applicationID}/c/{componentID}:
    get:
      tags: [Components]
      summary: Get component identity + per-env presence rollup
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/ComponentID'
      responses:
        '200':
          description: Component identity with environment presence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Components]
      summary: Wipe component identity, all revisions, all env CRDs
      description: |
        Deletes the Mongo identity row, every revision (drafts + deployed
        history), and the live `Component` CRD in every environment where
        the component had any revision. Idempotent against missing CRDs.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/ComponentID'
      responses:
        '204':
          description: Component fully removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/c/{componentID}/promote:
    post:
      tags: [Components]
      summary: Promote the latest deployed revision from one env to another
      description: |
        Reads the latest `deployed` revision in `from` and inserts a new
        `draft` in `to` with copied values. Returns 400 if `from` has no
        deployed revision (drafts are not promotable).
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/ComponentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoteRequest'
      responses:
        '201':
          description: New draft revision in the target env
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Env-scoped components & revisions --------------------------------------
  /organizations/{organizationID}/a/{applicationID}/e/{environment}/c:
    get:
      tags: [Components]
      summary: List components present in this environment
      description: |
        Reads `Component` CRDs from the environment namespace
        (`{envID}-{envName}`) filtered by the `conure.io/application-id`
        label.

        **Lazy auto-import:** any CRD with the required labels but no
        matching Mongo identity is auto-imported on observation —
        identity is created and a v1 `deployed` revision is written with
        the live values. Idempotent: re-listing without changes does not
        write a duplicate revision; mutations do produce a new deployed
        revision.

        Each entry includes the live values, the last-deployed revision
        snapshot, the structured drift diff, and the rollup `Ready`
        condition reported by the controller.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
      responses:
        '200':
          description: Components present in the env namespace
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentInEnvListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}/c/{componentID}:
    get:
      tags: [Components]
      summary: Live K8s state + last-deployed snapshot + drift
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/ComponentID'
      responses:
        '200':
          description: Component env-scoped detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentInEnvResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}/c/{componentID}/deploy:
    post:
      tags: [Components]
      summary: Deploy the latest draft to K8s
      description: |
        Loads the latest `draft` revision for `(component, env)`, applies
        the rendered manifest to K8s, and atomically flips the revision to
        `deployed` with `deployed_at=now`. The status transition is final
        and immutable.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/ComponentID'
      responses:
        '200':
          description: Revision deployed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}/c/{componentID}/uninstall:
    post:
      tags: [Components]
      summary: Remove the component from this environment
      description: |
        Deletes the live `Component` CRD plus its variables `ConfigMap` and
        `Secret` in the env namespace, and purges all `draft` revisions for
        `(component, env)`. Deployed history is retained for audit and
        potential rollback. Idempotent.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/ComponentID'
      responses:
        '204':
          description: Component uninstalled from this env
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}/c/{componentID}/revisions:
    get:
      tags: [Revisions]
      summary: List revisions for (component, env)
      description: Newest first. Includes both drafts and deployed revisions.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/ComponentID'
      responses:
        '200':
          description: Revision list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentRevisionListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [Revisions]
      summary: Create a new draft revision
      description: |
        Inserts a new `draft` revision at the next version. Promote is the
        recommended way to seed a brand-new env; this endpoint is the right
        call when editing values directly in the current env.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/ComponentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRevisionRequest'
      responses:
        '201':
          description: Draft revision created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}/c/{componentID}/revisions/{revID}:
    put:
      tags: [Revisions]
      summary: Update a draft revision's values
      description: |
        Replaces `values` on an existing `draft` revision. Deployed
        revisions are immutable and reject this call with 403.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/ComponentID'
        - $ref: '#/components/parameters/RevisionID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRevisionRequest'
      responses:
        '200':
          description: Draft updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentRevision'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Target revision is deployed and immutable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'

  /organizations/{organizationID}/a/{applicationID}/e/{environment}/c/{componentID}/revisions/{revID}/deploy:
    post:
      tags: [Revisions]
      summary: Deploy a specific revision (rollback / redeploy)
      description: |
        Loads revision `revID`, copies its `values` into a **new** revision
        at the next version, marks the new revision `deployed`, and applies
        it to K8s. The original revision is untouched (immutable history).
        This is the rollback primitive: pointing at a historical revision
        creates a fresh deployed revision at the head.
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/Environment'
        - $ref: '#/components/parameters/ComponentID'
        - $ref: '#/components/parameters/RevisionID'
      responses:
        '200':
          description: New deployed revision created and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ComponentRevision'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # Variables --------------------------------------------------------------
  /variables/{organizationID}:
    get:
      tags: [Variables]
      summary: List organization variables
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: List of variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Variables]
      summary: Create organization variable
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariableRequest'
      responses:
        '201':
          description: Variable created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /variables/{organizationID}/{variableID}:
    delete:
      tags: [Variables]
      summary: Delete variable
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/VariableID'
      responses:
        '204':
          description: Variable deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /variables/{organizationID}/{applicationID}/e/{environmentID}:
    get:
      tags: [Variables]
      summary: List environment variables
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/EnvironmentID'
      responses:
        '200':
          description: List of variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Variables]
      summary: Create environment variable
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/EnvironmentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariableRequest'
      responses:
        '201':
          description: Variable created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /variables/{organizationID}/{applicationID}/e/{environmentID}/c/{componentID}:
    get:
      tags: [Variables]
      summary: List component variables
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/EnvironmentID'
        - $ref: '#/components/parameters/ComponentID'
      responses:
        '200':
          description: List of variables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Variable'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Variables]
      summary: Create component variable
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/ApplicationID'
        - $ref: '#/components/parameters/EnvironmentID'
        - $ref: '#/components/parameters/ComponentID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVariableRequest'
      responses:
        '201':
          description: Variable created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Variable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  # Integrations -----------------------------------------------------------
  /settings/{organizationID}/i:
    get:
      tags: [Integrations]
      summary: List integrations
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      responses:
        '200':
          description: List of integrations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Integration'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags: [Integrations]
      summary: Create integration
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateIntegrationRequest'
      responses:
        '201':
          description: Integration created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Integration'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /settings/{organizationID}/i/{integrationID}:
    delete:
      tags: [Integrations]
      summary: Delete integration
      parameters:
        - $ref: '#/components/parameters/OrganizationID'
        - $ref: '#/components/parameters/IntegrationID'
      responses:
        '204':
          description: Integration deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: auth

  parameters:
    OrganizationID:
      name: organizationID
      in: path
      required: true
      description: Organization ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: "507f1f77bcf86cd799439011"

    ApplicationID:
      name: applicationID
      in: path
      required: true
      description: Application ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: "507f1f77bcf86cd799439012"

    ComponentID:
      name: componentID
      in: path
      required: true
      description: Component ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: "507f1f77bcf86cd799439013"

    RevisionID:
      name: revID
      in: path
      required: true
      description: Component revision ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: "507f1f77bcf86cd799439020"

    Environment:
      name: environment
      in: path
      required: true
      description: Environment name
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        example: "production"

    EnvironmentID:
      name: environmentID
      in: path
      required: true
      description: Environment name (used as path-id by the variables routes)
      schema:
        type: string
        pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
        example: "staging"

    VariableID:
      name: variableID
      in: path
      required: true
      description: Variable ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: "507f1f77bcf86cd799439014"

    IntegrationID:
      name: integrationID
      in: path
      required: true
      description: Integration ID
      schema:
        type: string
        pattern: '^[0-9a-fA-F]{24}$'
        example: "507f1f77bcf86cd799439015"

  schemas:
    # Authentication -------------------------------------------------------
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: "admin@example.com"
        password:
          type: string
          format: password
          example: "password123"

    ChangePasswordRequest:
      type: object
      required: [old_password, password, password2]
      properties:
        old_password:
          type: string
          format: password
        password:
          type: string
          format: password
        password2:
          type: string
          format: password

    User:
      type: object
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        email:
          type: string
          format: email
        is_active:
          type: boolean
        last_login_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        client:
          type: string

    # Organizations --------------------------------------------------------
    Organization:
      type: object
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        status:
          type: string
          enum: [active, deleted, disabled]
        account_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
        created_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "My Organization"

    OrganizationListResponse:
      type: object
      properties:
        organizations:
          type: array
          items:
            $ref: '#/components/schemas/Organization'

    # Applications ---------------------------------------------------------
    Application:
      type: object
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        organization_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        account_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        created_at:
          type: string
          format: date-time
        environments:
          type: array
          items:
            $ref: '#/components/schemas/Environment'

    CreateApplicationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    ApplicationListResponse:
      type: object
      properties:
        organization:
          $ref: '#/components/schemas/Organization'
        applications:
          type: array
          items:
            allOf:
              - $ref: '#/components/schemas/Application'
              - type: object
                properties:
                  total_components:
                    type: integer
                    example: 3

    # Environments ---------------------------------------------------------
    Environment:
      type: object
      properties:
        id:
          type: string
          description: 8-digit hash assigned at creation
          example: "a706b839"
        name:
          type: string
          example: "staging"

    CreateEnvironmentRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
          example: "production"

    # Components -----------------------------------------------------------
    Component:
      type: object
      description: |
        Component identity. **Note:** values are stored on per-environment
        `ComponentRevision`s, not on the identity row.
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
          example: "fastapi-demo"
        type:
          type: string
          example: "webservice"
        description:
          type: string
        application_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateComponentRequest:
      type: object
      required: [name, type, environment]
      properties:
        name:
          type: string
          example: "fastapi-demo"
        type:
          type: string
          example: "webservice"
        description:
          type: string
        environment:
          type: string
          description: Target env for the first draft revision
          example: "staging"
        values:
          type: object
          additionalProperties: true
          description: Initial values for the v1 draft revision

    EnvironmentPresence:
      type: object
      description: Per-environment rollup for an app-wide component view.
      properties:
        environment_id:
          type: string
          example: "a706b839"
        environment_name:
          type: string
          example: "staging"
        active:
          type: boolean
          description: True iff a `Component` CRD currently exists in the env namespace.
        has_draft:
          type: boolean
        latest_draft_version:
          type: integer
          nullable: true
        latest_deployed_version:
          type: integer
          nullable: true
        drifted:
          type: boolean

    ComponentResponse:
      allOf:
        - $ref: '#/components/schemas/Component'
        - type: object
          properties:
            environments:
              type: array
              items:
                $ref: '#/components/schemas/EnvironmentPresence'

    ComponentListResponse:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentResponse'

    ComponentInEnvResponse:
      type: object
      description: |
        Env-scoped detail: live K8s values, last-deployed Mongo snapshot,
        latest draft, structured drift diff, and the controller's Ready
        rollup condition.
      properties:
        component_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
        environment_id:
          type: string
        environment_name:
          type: string
        live_values:
          type: object
          additionalProperties: true
          description: Spec.Values from the live `Component` CRD.
        deployed_revision:
          $ref: '#/components/schemas/ComponentRevision'
        latest_draft:
          $ref: '#/components/schemas/ComponentRevision'
        drifted:
          type: boolean
        diff:
          type: array
          items:
            $ref: '#/components/schemas/DriftEntry'
        health_condition:
          type: string
          example: "Ready"
        health_status:
          type: string
          enum: ["True", "False", "Unknown"]
          example: "True"
        health_message:
          type: string

    ComponentInEnvListResponse:
      type: object
      properties:
        components:
          type: array
          items:
            $ref: '#/components/schemas/ComponentInEnvResponse'

    DriftEntry:
      type: object
      description: One point of divergence between live and deployed values.
      properties:
        path:
          type: string
          description: Dot-separated path (`spec.replicas`, `image`, `ports.0.targetPort`).
          example: "image"
        live:
          description: Value observed in the live CRD.
        deployed:
          description: Value from the last deployed revision.

    # Revisions ------------------------------------------------------------
    ComponentRevision:
      type: object
      description: |
        Versioned, immutable-once-deployed snapshot of values for a
        `(component, environment)` pair.
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        component_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        environment_id:
          type: string
          example: "a706b839"
        version:
          type: integer
          minimum: 1
          example: 3
        values:
          type: object
          additionalProperties: true
        status:
          type: string
          enum: [draft, deployed]
        deployed_at:
          type: string
          format: date-time
          nullable: true
          description: Set when status flips to `deployed`; never modified after.
        created_by:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        created_at:
          type: string
          format: date-time

    ComponentRevisionListResponse:
      type: object
      properties:
        revisions:
          type: array
          items:
            $ref: '#/components/schemas/ComponentRevision'

    CreateRevisionRequest:
      type: object
      properties:
        values:
          type: object
          additionalProperties: true

    UpdateRevisionRequest:
      type: object
      properties:
        values:
          type: object
          additionalProperties: true

    PromoteRequest:
      type: object
      required: [from, to]
      properties:
        from:
          type: string
          description: Source environment name
          example: "staging"
        to:
          type: string
          description: Target environment name
          example: "production"

    # Bulk deploy ----------------------------------------------------------
    DeployBatchEntry:
      type: object
      properties:
        component_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        component_name:
          type: string
        revision_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
          description: Set on the `deployed` slice; absent on `failed`.
        version:
          type: integer
          nullable: true
        error:
          type: string
          nullable: true
          description: Set on the `failed` slice.

    DeployBatchResponse:
      type: object
      properties:
        deployed:
          type: array
          items:
            $ref: '#/components/schemas/DeployBatchEntry'
        failed:
          type: array
          items:
            $ref: '#/components/schemas/DeployBatchEntry'

    # Variables ------------------------------------------------------------
    Variable:
      type: object
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        name:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_]*$'
        value:
          type: string
        type:
          type: string
          enum: [organization, environment, component]
        organization_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        application_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
        environment_id:
          type: string
          nullable: true
        component_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
          nullable: true
        is_encrypted:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateVariableRequest:
      type: object
      required: [name, value]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z_][a-zA-Z0-9_]*$'
        value:
          type: string
        is_encrypted:
          type: boolean
          default: false

    # Integrations ---------------------------------------------------------
    Integration:
      type: object
      properties:
        id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        organization_id:
          type: string
          pattern: '^[0-9a-fA-F]{24}$'
        integration_type:
          type: string
          example: "docker_registry"
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateIntegrationRequest:
      type: object
      required: [name, integration_type, integration_value]
      properties:
        name:
          type: string
        integration_type:
          type: string
          enum: [docker_registry]
        integration_value:
          oneOf:
            - $ref: '#/components/schemas/DockerRegistryIntegration'

    DockerRegistryIntegration:
      type: object
      required: [registry_url, username, password]
      properties:
        registry_url:
          type: string
          format: uri
        username:
          type: string
        password:
          type: string
          format: password

    # Errors ---------------------------------------------------------------
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        details:
          type: object

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "invalid_request"
            code: "2001"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "unauthorized"
            code: "1000"

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "not_allowed"
            code: "1007"

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "object_not_found"
            code: "2002"

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: "internal_error"
            code: "3001"

tags:
  - name: Authentication
    description: User authentication and session management
  - name: Organizations
    description: Organization management
  - name: Applications
    description: Application identity and listing
  - name: Environments
    description: Per-application environments and bulk deploy
  - name: Components
    description: Component identity (app-wide) and env-scoped live state
  - name: Revisions
    description: Versioned values for a (component, environment) pair
  - name: Variables
    description: Scoped variables and secrets (org / env / component)
  - name: Integrations
    description: External service integrations
