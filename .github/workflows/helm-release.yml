name: helm-release

on:
  push:
    branches: [main]
    paths:
      - "deploy/helm/conure/**"
      - ".github/workflows/helm-release.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: package-and-push
    runs-on: ubuntu-latest
    env:
      CHART_DIR: deploy/helm/conure
      OCI_REGISTRY: ghcr.io/coffeenights/charts
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: Read chart metadata
        id: chart
        run: |
          name=$(yq '.name' "$CHART_DIR/Chart.yaml")
          version=$(yq '.version' "$CHART_DIR/Chart.yaml")
          echo "name=$name"       >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Lint chart
        run: helm lint "$CHART_DIR"

      - name: Package chart
        run: helm package "$CHART_DIR" --destination .

      - name: Login to GHCR
        run: |
          echo "${{ secrets.GHCR_HELM_PUSH_TOKEN }}" \
            | helm registry login ghcr.io -u "${{ vars.GHCR_USER }}" --password-stdin

      - name: Push chart to OCI registry
        run: |
          helm push \
            "${{ steps.chart.outputs.name }}-${{ steps.chart.outputs.version }}.tgz" \
            "oci://$OCI_REGISTRY"

      - name: Summary
        run: |
          echo "Published **${{ steps.chart.outputs.name }}** \
            \`${{ steps.chart.outputs.version }}\` to \
            \`oci://$OCI_REGISTRY/${{ steps.chart.outputs.name }}\`" \
            >> "$GITHUB_STEP_SUMMARY"